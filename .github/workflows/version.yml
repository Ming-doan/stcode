# Bump the version on `main`, by hand, in one click.
#
# Actions → version → Run workflow → patch | minor | major. It rewrites `version` in
# pyproject.toml and uv.lock and pushes the commit to main. Merging main into `publish`
# then releases it.
#
# Deliberately not automatic on every merge: a release number is a statement about
# what changed, and patch-by-default would call a breaking change a bugfix.

name: version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@v10
      - name: Bump
        id: bump
        run: |
          uv version --bump "${{ inputs.bump }}" --no-sync
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          echo "Bumped to **${{ steps.bump.outputs.version }}**. Merge main into publish to release it." >> "$GITHUB_STEP_SUMMARY"

# Deploy the landing page and the docs to GitHub Pages.
#
#   https://ming-doan.github.io/stcode/        landing/  (copied as-is)
#   https://ming-doan.github.io/stcode/docs/   mkdocs build of docs/
#
# Deploys from `main` and from `publish`, whichever pushed last. Requires
# Settings → Pages → Source = "GitHub Actions", and `publish` added to the
# github-pages environment's allowed branches (it allows only the default one).

name: pages

on:
  push:
    branches: [main, publish]
    paths:
      - "docs/**"
      - "landing/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Build the docs into _site/docs
        run: uv run --only-group docs mkdocs build --strict -d _site/docs
      - name: Put the landing page at the root
        run: cp -r landing/. _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

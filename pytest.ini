[pytest]
testpaths = tests
python_files = *_test.py test_*.py

# `tests/` on the path, so every module can `from fakes import ...` and
# `from conftest import asynctest` regardless of how deep it sits.
pythonpath = tests

# Tests that call a real provider are opt-in: `uv run pytest -m live`. Left in the
# default run they turn "no API key on this machine" into a red suite, which trains
# everyone to ignore red.
addopts = -m "not live"
markers =
    live: hits a real LLM provider over the network; needs credentials.

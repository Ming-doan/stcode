# The documentation site. Build it with `uv run --group docs mkdocs serve`.
#
# Two rules keep this file honest:
#
#   1. `nav` is explicit. A page not listed here is a page nobody navigates to, and
#      mkdocs says so at build time — which is the only way a doc written and then
#      forgotten gets noticed.
#   2. `strict: true`. A broken internal link fails the build. Docs drift silently;
#      this is the one kind of drift a machine can catch.
#
# Internal engineering notes stay in the repository. `exclude_docs` keeps them out
# of the published HTML, sitemap and search index, not just the navigation.

site_name: stcode
site_description: An open source coding agent for your terminal, remote workspaces, and Python workflows.
# Served under /docs/ — the landing page (landing/) owns the root. See .github/workflows/pages.yml.
site_url: https://ming-doan.github.io/stcode/docs/
repo_url: https://github.com/Ming-doan/stcode
edit_uri: edit/main/docs/

strict: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  # Required for the `markdown` attribute on a <div>, which is how Material's
  # grid cards on the home page get their content processed.
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  # The architecture pages already draw with mermaid. Without this fence they render
  # as an unreadable code block.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Guide:
      - Local and remote work: guide/shapes.md
      - Terminal UI: guide/tui.md
      - Approval modes: guide/approval-modes.md
      - Sessions: guide/sessions.md
      - Tools: guide/tools.md
      - Skills: guide/skills.md
      - MCP servers: guide/mcp.md
      - Working with data: guide/repl.md
      - Tracing: guide/tracing.md
  - Teams:
      - Setting one up: teams/setup.md
      - Roles: teams/roles.md
      - How a team works: teams/workflow.md
  - Python SDK:
      - Getting started: sdk/embedding.md
      - Streaming and sessions: sdk/streaming.md
      - Custom tools: sdk/custom-tools.md

exclude_docs: |
  /architecture/
  /decisions/
  /contributing/
  /sdk/daemon-protocol.md

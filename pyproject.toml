[project]
name = "stcode"
version = "0.0.1"
description = "Terminal Coding Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.122.0",
    "asyncer>=0.0.18",
    "google-genai>=2.18.1",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter-client>=8.9.1",
    "openai>=3.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
    "typer>=0.27.1",
]

[project.scripts]
stcode = "stcode.cli.main:cli"

[dependency-groups]
dev = [
    "textual-dev>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stcode"]

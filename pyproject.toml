[project]
name = "stcode"
version = "0.0.1"
description = "A coding agent that lives in a daemon, and a UI that is a client of it."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Minh Doan", email = "quangminh57dng@gmail.com" }]
keywords = ["agent", "llm", "coding-agent", "tui", "mcp", "daemon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "anthropic>=0.122.0",
    "asyncer>=0.0.18",
    "docstring-parser>=0.18.0",
    "google-genai>=2.18.1",
    "httpx>=0.28.1",
    "mcp>=2.1.1",
    "openai>=3.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "ripgrep>=15.1.0",
    "textual>=8.2.8",
    "tomli>=2.0.1; python_version < '3.11'",
    "tomli-w>=1.2.0",
    "typer>=0.27.1",
]

[project.urls]
Homepage = "https://ming-doan.github.io/stcode/"
Documentation = "https://ming-doan.github.io/stcode/docs/"
Source = "https://github.com/Ming-doan/stcode"
Issues = "https://github.com/Ming-doan/stcode/issues"

[project.optional-dependencies]
# Tracing. Off by default and imported only when [trace] enabled = true, so a session
# that is not being watched pays nothing for it.
otel = [
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]

[project.scripts]
stcode = "stcode.cli.main:run_cli"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "textual-dev>=1.7.0",
]
docs = [
    # Pinned below 2.0 deliberately: MkDocs 2.0 removes the plugin system and the
    # theming system with no migration path, so `mkdocs-material` does not run on it.
    # Raise this only together with a Material release that supports it.
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The sdist is what PyPI archives: the package, its tests, and the files that describe
# it. Local agent state, the docs site and the landing page stay in the repository.
[tool.hatch.build.targets.sdist]
exclude = [".stcode/", ".claude/", ".github/", "landing/", "notebooks/", "temp/", "site/", "skills-lock.json"]

[tool.hatch.build.targets.wheel]
packages = ["stcode"]

# stcode config — copy to ~/.stcode/config.toml (or %APPDATA%\stcode\config.toml
# on Windows), or point STCODE_CONFIG at a file of your own.
#
# You don't have to write this by hand: the first `stcode` run offers a setup screen
# that writes the file for you, and /model edits it afterwards.
#
# Credentials resolve env-first: `api_key_env` names an environment variable, `api_key`
# is a literal fallback, and the variable wins whenever it's actually set. The setup
# screen writes a literal when you paste a key, and chmods the file 0600 for that reason.
# Prefer api_key_env if you'd rather keep secrets off disk entirely.

# What the TUI starts with — set by the setup screen, /model, and /mode.
# An empty model means "not chosen yet"; the chat screen warns until it's set.
[defaults]
provider = "openai"
model = ""
approval_mode = "suggest"   # plan | suggest | auto-edit | full-auto

[providers.anthropic]
api_key_env = "ANTHROPIC_API_KEY"
# api_key = "sk-ant-..."                   # literal fallback; env var above wins
# base_url = "https://api.anthropic.com"   # override for a proxy/self-hosted gateway

[providers.openai]
api_key_env = "OPENAI_API_KEY"
# base_url_env = "OPENAI_BASE_URL"  # for an OpenAI-compatible proxy; wins over base_url
# base_url = "https://my-openai-proxy.example.com/v1"
# max_concurrent = 1   # completions this endpoint serves at once; 0 = no cap.
#                      # Set 1 for Ollama or llama.cpp: parallel sub-agents otherwise
#                      # queue up against one GPU and get dropped as 503s.

[providers.google]
api_key_env = "GEMINI_API_KEY"

# Each tier picks a provider + model. api_key_env/api_key/base_url are optional per tier —
# omit them and the tier falls back to that provider's main config above. Set them
# only when a tier needs different credentials or a different endpoint, e.g. a
# higher-quota key reserved for "high".
#
# Saving from /model repoints any tier that was tracking the default provider at the
# newly chosen model. Pin a tier to a *different* provider and the UI leaves it alone.
[routing.low]
provider = "anthropic"
model = "claude-haiku-4-5"

[routing.medium]
provider = "anthropic"
model = "claude-sonnet-5"

[routing.high]
provider = "anthropic"
model = "claude-opus-5"
# api_key_env = "ANTHROPIC_API_KEY_HIGH"
# base_url = "https://my-proxy.example.com"

[retry]
max_attempts = 3
base_delay = 1.0
max_delay = 20.0
jitter = true

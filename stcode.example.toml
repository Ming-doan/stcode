# stcode config — the daemon's file. It lives at ~/.stcode/config.toml (STCODE_HOME moves
# the directory, STCODE_CONFIG or `stcode-daemon --config` names another file).
#
# You don't have to write this by hand: the daemon scaffolds a minimal one on first
# start, the UI's setup screen fills in a key, and /model, /mode and /effort change
# single keys in place — comments like these survive.
#
# A secret is a literal or a "${ENV_VAR}" reference, resolved when it is used, so the
# file never has to hold the key itself. It is chmod 0600 in case it does. The UI can
# only send a key over the daemon's unix socket, never over TCP.

[model]
default = "anthropic"            # the entry used when no [model.routing] tier applies;
                                 # unset = the first entry below

# One table per account. The name is yours; `provider` picks the library. Two keys for
# one library are two entries — e.g. [model.providers.work] and [model.providers.home].
[model.providers.anthropic]
provider = "anthropic"
api_key = "${ANTHROPIC_API_KEY}"   # unset = the library's conventional variable
model = "claude-sonnet-5"          # unset = the library's default model

[model.providers.openai]
provider = "openai"
api_key = "${OPENAI_API_KEY}"
# base_url = "${OPENAI_BASE_URL}"  # an OpenAI-compatible proxy or local server
# max_concurrent = 1               # completions this endpoint serves at once; 0 = no cap.
#                                  # Set 1 for Ollama or llama.cpp: parallel sub-agents
#                                  # otherwise queue against one GPU and drop as 503s.

# [model.providers.google]
# provider = "google"
# api_key = "${GEMINI_API_KEY}"

# Optional, per difficulty tier. A tier with no line uses the default entry above.
[model.routing.low]
provider = "anthropic"
model = "claude-haiku-4-5"

[model.retry]
max_attempts = 3
base_delay = 1.0
max_delay = 20.0
jitter = true

# Limits on one turn. `prompt` (or `prompt_file`) is what makes this file a whole *agent
# profile*: the prompt lives beside the settings it runs under, so deploying an agent is
# one mount — `-v ./agents/backend-dev.toml:/config/config.toml`. → docs/teams/roles.md
[agent]
reasoning_effort = "medium"      # none | minimal | low | medium | high | xhigh | max
approval_mode = "suggest"        # plan | suggest | auto-edit | full-auto (containers only)
max_turns = 40
difficulty = "high"
# tools = ["read", "grep", "glob", "ls"]   # an allow-list, replacing the default set
# exclude_tools = ["web_search"]           # subtracted from whatever is left
# prompt = """
# # Role: backend developer
# """
# prompt_file = "backend-dev.md"   # relative to this file; `prompt` wins if both are set

# Where transcripts live. Default ~/.stcode/sessions.
# [session]
# dir = "./.stcode/sessions"
# keep = 100

# Where the daemon listens. `unix` on your own machine, `tcp` inside a container.
# The UI does not read this: it connects to ~/.stcode/daemon.sock unless told otherwise
# with --socket / --transport tcp --host --port, and starts the daemon on that address.
[daemon]
transport = "unix"
# socket = "~/.stcode/daemon.sock"
# host = "0.0.0.0"       # when transport = "tcp"
# port = 7717
# max_clients = 0        # connections at once. Unset = 1 in a container, unlimited on
#                        # the host. 0 is unlimited everywhere.

# Team mode is OFF until `enabled` is true (or STCODE_TEAM=1, or --team). A role says
# which agent this is (or STCODE_ROLE); team mode says a shared volume is mounted.
# [team]
# enabled    = true
# role       = "backend-dev"
# shared_dir = "/team"

# The supervisor watches for loops. Off unless enabled (or STCODE_SUPERVISOR=1).
# [supervisor]
# enabled = true
# every = 8

# [mcp]
# expose = "code"        # or "tools"

# Direct HTTP tracing. Unset values fall back to the provider's own variables
# (LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, LANGFUSE_BASE_URL; PHOENIX_API_KEY,
# PHOENIX_COLLECTOR_ENDPOINT, PHOENIX_PROJECT_NAME). .env is not loaded.
# [trace]
# enabled = true
# provider = "langfuse"       # or "phoenix"
# public_key = "${LANGFUSE_PUBLIC_KEY}"
# secret_key = "${LANGFUSE_SECRET_KEY}"
# content = false             # true includes prompts, replies and tool contents

# Built-in tool credentials.
# [tools]
# tavily_api_key = "${TAVILY_API_KEY}"   # web_search; this is also the default
